name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Types, tests on React 19 + Ink 8, tests on React 18 + Ink 5, build.
      - run: npm run check
      # The package must contain the two licenses and no test file.
      - name: Check the package contents
        run: |
          npm pack --dry-run --json > pack.json
          node -e "
            const files = require('./pack.json')[0].files.map((f) => f.path);
            const need = ['LICENSE', 'LICENSE-APACHE-2.0', 'README.md', 'CHANGELOG.md', 'dist/index.js', 'dist/index.cjs', 'dist/index.d.ts'];
            const missing = need.filter((f) => !files.includes(f));
            const extra = files.filter((f) => /test|compat|^src\//.test(f));
            if (missing.length || extra.length) {
              console.error({ missing, extra });
              process.exit(1);
            }
            console.log(files.length + ' files, as expected');
          "
