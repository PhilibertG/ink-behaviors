name: Release

# On every push to main, release-please opens or updates a "release" pull
# request with the next version number and the CHANGELOG. Merging that pull
# request creates the git tag and the GitHub release, and then the package
# is published to npm.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm trusted publishing: GitHub proves who it is, no token is stored.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Trusted publishing needs Node 22.14+ and npm 11.5.1+.
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      # prepublishOnly runs the full check before anything is sent.
      - run: npm publish
